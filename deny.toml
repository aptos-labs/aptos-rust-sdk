# cargo-deny configuration.
#
# Enforced by `.github/workflows/security.yml` (`cargo deny check`).
# Keep the license allow-list tight enough that a new copyleft or
# proprietary dependency fails CI, but broad enough for the crates.io
# licenses this workspace already uses.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "NCSA",
    "OpenSSL",
    "MPL-2.0",
    "CDDL-1.0",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate are common in the Rust graph and
# should not fail CI; still surface them as warnings in the logs.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
