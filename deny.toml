# cargo-deny configuration.
#
# Enforced by `.github/workflows/security.yml` (`cargo deny check`).
# The license allow-list is the set of SPDX licenses currently in this
# workspace's dependency graph on the platforms CI builds. A newly added
# copyleft or proprietary crate fails CI.

[graph]
all-features = true
# Only the triples CI actually builds. Unrestricted graphs pull in
# target-only crates such as `r-efi` (LGPL) for UEFI.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate are common in the Rust graph and
# should not fail CI; still surface them as warnings in the logs.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
