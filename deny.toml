# cargo-deny configuration.
#
# Enforced by `.github/workflows/security.yml` (`cargo deny check`).
# The license allow-list is the set of SPDX licenses currently in this
# workspace's dependency graph on the platforms CI builds. A newly added
# copyleft or proprietary crate fails CI.

[graph]
all-features = true
# Only the triples CI actually builds. Unrestricted graphs pull in
# target-only crates such as `r-efi` (LGPL) for UEFI.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate are common in the Rust graph and
# should not fail CI; still surface them as warnings in the logs.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Known crates.io malware / hijacked releases. Entries only fail CI if the
# crate actually appears in the graph; they do not affect the current lockfile.
# See: https://www.wiz.io/blog/rust-supply-chain-attack-on-arrayref-significant-overlap-with-dprk-campaigns
#      https://rustsec.org/advisories/RUSTSEC-2026-0175.html
deny = [
    # 2026-08-20: maintainer account hijack. Dropper lived in typosquat
    # `proc-macro1` `build.rs` (download + exec at compile time).
    { crate = "arrayref@0.3.10", reason = "hijacked release; pulled in proc-macro1 dropper (2026-08-20)" },
    { crate = "internment@0.8.7", reason = "hijacked release; pulled in proc-macro1 dropper (2026-08-20)" },
    { crate = "append-only-vec@0.1.9", reason = "hijacked release; pulled in proc-macro1 dropper (2026-08-20)" },
    { crate = "proc-macro1", reason = "typosquat of proc-macro2; all versions deleted from crates.io (2026-08-20)" },
    { crate = "proc-macro-en", reason = "attacker-controlled lookalike; deleted from crates.io (2026-08-20)" },
    { crate = "aovine", reason = "attacker-controlled crate; deleted from crates.io (2026-08-20)" },
    { crate = "arone", reason = "attacker-controlled crate; deleted from crates.io (2026-08-20)" },
    { crate = "aronenao", reason = "attacker-controlled crate; deleted from crates.io (2026-08-20)" },
    { crate = "tinymember", reason = "attacker-controlled crate; deleted from crates.io (2026-08-20)" },
    # 2026-06-10: RUSTSEC-2026-0175. Malicious build.rs exfiltrated git diffs.
    { crate = "onering@1.4.1", reason = "RUSTSEC-2026-0175: malicious build.rs source-exfiltration" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
