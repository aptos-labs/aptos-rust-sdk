name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  e2e-localnet:
    name: E2E Tests (Localnet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.95"

      - name: Install Aptos CLI
        run: |
          curl -fsSL "https://aptos.dev/scripts/install_cli.py" | python3
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Aptos CLI installation
        run: aptos --version

      - name: Start localnet
        run: |
          aptos node run-localnet --with-faucet --force-restart > "${{ runner.temp }}/localnet.log" 2>&1 &
          echo "LOCALNET_PID=$!" >> $GITHUB_ENV
          dump_localnet_probes() {
            echo "--- GET http://127.0.0.1:8070/ (CLI readiness) ---"
            curl -sS -D- --max-time 5 http://127.0.0.1:8070/ || true
            echo "--- GET http://127.0.0.1:8080/v1 (node API) ---"
            curl -sS -D- --max-time 5 http://127.0.0.1:8080/v1 || true
            echo "--- GET http://127.0.0.1:8081/ (faucet health is GET /, not /health) ---"
            curl -sS -D- --max-time 5 http://127.0.0.1:8081/ || true
            echo "--- GET http://127.0.0.1:8081/health (expected 404) ---"
            curl -sS -D- --max-time 5 http://127.0.0.1:8081/health || true
            cat "${{ runner.temp }}/localnet.log"
          }
          # The CLI's unified readiness server returns 503 until the node API,
          # faucet, and other enabled services are up, then 200.
          # Do not probe 8081/health: faucet OpenAPI health is GET / ("Ok").
          # `curl -sf /health` 404s forever; the previous `curl -s` (no -f)
          # treated that 404 as ready once the port accepted TCP.
          for i in $(seq 1 90); do
            if curl -sf --max-time 5 http://127.0.0.1:8070/ >/dev/null; then
              echo "Localnet readiness endpoint is 200 after ~$((i * 2))s"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Localnet failed to become ready within 180s"
              dump_localnet_probes
              exit 1
            fi
            sleep 2
          done
          # Pin the two endpoints the SDK actually uses, not just 8070.
          if ! curl -sf --max-time 5 http://127.0.0.1:8080/v1 | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("chain_id"), int)'; then
            echo "Node API did not return a ledger document with integer chain_id"
            dump_localnet_probes
            exit 1
          fi
          faucet_body=$(curl -sf --max-time 5 http://127.0.0.1:8081/) || {
            echo "Faucet GET / did not return HTTP 200"
            dump_localnet_probes
            exit 1
          }
          echo "Faucet health: ${faucet_body}"

      - name: Run E2E tests
        env:
          APTOS_LOCAL_FAUCET_URL: http://127.0.0.1:8081
          APTOS_LOCAL_NODE_URL: http://127.0.0.1:8080/v1
        run: |
          set -euo pipefail
          # `tests/lib.rs` only (`--test lib`): `cargo test -- --ignored` also
          # reports rustdoc ` ```ignore ` examples as passing in 0.00s, and
          # `--tests -- --ignored` still runs the lib unit-test harness which
          # prints `ok. 0 passed` (those tests are not #[ignore]).
          # `--test-threads=1` avoids localnet races. Disable cargo color so
          # the pass-count grep below is not fooled by ANSI codes
          # (`CARGO_TERM_COLOR=always` is set workflow-wide).
          CARGO_TERM_COLOR=never cargo test -p aptos-sdk --locked --features "e2e,full" --test lib -- --ignored --test-threads=1 | tee "${{ runner.temp }}/e2e-test.log"
          if ! grep -E 'test result: ok\. [1-9][0-9]* passed' "${{ runner.temp }}/e2e-test.log" >/dev/null; then
            echo "E2E suite ran 0 tests; refusing to pass"
            exit 1
          fi
          if ! grep -E '^test e2e::.* \.\.\. ok$' "${{ runner.temp }}/e2e-test.log" >/dev/null; then
            echo "No e2e::* tests passed"
            exit 1
          fi

      - name: Print localnet logs on failure
        if: failure()
        run: cat "${{ runner.temp }}/localnet.log"

      - name: Stop localnet
        if: always()
        run: |
          kill "$LOCALNET_PID" 2>/dev/null || true
          pkill -f "aptos node" || true
