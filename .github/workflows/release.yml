name: Release

on:
  push:
    tags:
      - 'sdk-v*.*.*'
      - 'sdk-v*.*.*-*'
      - 'macros-v*.*.*'
      - 'macros-v*.*.*-*'
  workflow_dispatch:
    inputs:
      crate:
        description: 'Which crate to publish'
        required: true
        type: choice
        options:
          - aptos-sdk
          - aptos-sdk-macros
          - both
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Determine which crates to publish based on the tag or manual input
  resolve:
    name: Resolve Crates
    runs-on: 4cpu-gh-ubuntu24-x64
    permissions:
      contents: read
    outputs:
      publish_macros: ${{ steps.resolve.outputs.publish_macros }}
      publish_sdk: ${{ steps.resolve.outputs.publish_sdk }}
    steps:
      - name: Resolve which crates to publish
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$INPUT_CRATE" in
              aptos-sdk-macros)
                echo "publish_macros=true" >> "$GITHUB_OUTPUT"
                echo "publish_sdk=false" >> "$GITHUB_OUTPUT"
                ;;
              aptos-sdk)
                echo "publish_macros=false" >> "$GITHUB_OUTPUT"
                echo "publish_sdk=true" >> "$GITHUB_OUTPUT"
                ;;
              both)
                echo "publish_macros=true" >> "$GITHUB_OUTPUT"
                echo "publish_sdk=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::Unsupported crate selection: $INPUT_CRATE"
                exit 1
                ;;
            esac
          else
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == macros-v* ]]; then
              echo "publish_macros=true" >> "$GITHUB_OUTPUT"
              echo "publish_sdk=false" >> "$GITHUB_OUTPUT"
            elif [[ "$TAG" == sdk-v* ]]; then
              echo "publish_macros=false" >> "$GITHUB_OUTPUT"
              echo "publish_sdk=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Unrecognized release tag: $TAG"
              exit 1
            fi
          fi

  verify:
    name: Verify Release
    runs-on: 4cpu-gh-ubuntu24-x64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit is on main and tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Tagged commit $(git rev-parse HEAD) is not an ancestor of origin/main."
            exit 1
          fi

          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == macros-v* ]]; then
            EXPECTED="${TAG#macros-v}"
            ACTUAL=$(grep '^version' crates/aptos-sdk-macros/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::Tag ${TAG} does not match crates/aptos-sdk-macros/Cargo.toml version ${ACTUAL}"
              exit 1
            fi
          elif [[ "$TAG" == sdk-v* ]]; then
            EXPECTED="${TAG#sdk-v}"
            ACTUAL=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::Tag ${TAG} does not match workspace version ${ACTUAL}"
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          cache: 'false'

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run doctests
        run: cargo test --workspace --doc --all-features --locked

      - name: Build documentation (docs.rs parity)
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo +nightly doc --no-deps --all-features --locked

  dry-run:
    name: Publish Dry Run
    runs-on: 4cpu-gh-ubuntu24-x64
    needs: [resolve, verify]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"

      # --no-verify: The aptos-sdk dev-dependency is path-only (dropped from the
      # published crate to break the circular publish dependency), so the
      # verification build would fail. The verify job already runs full tests
      # with workspace path resolution.
      - name: Dry-run publish aptos-sdk-macros
        if: needs.resolve.outputs.publish_macros == 'true'
        run: cargo publish -p aptos-sdk-macros --no-verify --dry-run

      - name: Dry-run publish aptos-sdk
        if: needs.resolve.outputs.publish_sdk == 'true'
        run: |
          cargo package -p aptos-sdk --locked
          cargo publish -p aptos-sdk --locked --dry-run

  publish:
    name: Publish to crates.io
    runs-on: 4cpu-gh-ubuntu24-x64
    environment: crates-io
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [resolve, verify]
    if: |
      (needs.resolve.outputs.publish_macros == 'true' || needs.resolve.outputs.publish_sdk == 'true') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"

      # Exchanges GitHub OIDC JWT for a short-lived crates.io token (auto-revoked
      # in the post-job hook). Requires one-time Trusted Publisher setup on
      # crates.io for `aptos-sdk` and `aptos-sdk-macros` (repo aptos-labs/aptos-rust-sdk,
      # workflow release.yml, environment crates-io).
      - name: Authenticate with crates.io (Trusted Publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish aptos-sdk-macros
        if: needs.resolve.outputs.publish_macros == 'true'
        run: cargo publish -p aptos-sdk-macros --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Attest build provenance for aptos-sdk-macros
        if: needs.resolve.outputs.publish_macros == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'target/package/aptos-sdk-macros-[0-9]*.crate'

      # If macros was just published alongside sdk, poll crates.io until indexed
      - name: Wait for crates.io to index aptos-sdk-macros
        if: needs.resolve.outputs.publish_macros == 'true' && needs.resolve.outputs.publish_sdk == 'true'
        run: |
          set -euo pipefail
          MACROS_VERSION=$(grep '^version' crates/aptos-sdk-macros/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Waiting for aptos-sdk-macros ${MACROS_VERSION} to appear on crates.io..."
          for i in $(seq 1 30); do
            if curl -sf -H "User-Agent: aptos-rust-sdk-ci" \
              "https://crates.io/api/v1/crates/aptos-sdk-macros/${MACROS_VERSION}" > /dev/null 2>&1; then
              echo "aptos-sdk-macros ${MACROS_VERSION} is now available on crates.io"
              sleep 15  # extra buffer for sparse index propagation
              exit 0
            fi
            echo "Attempt ${i}/30: not yet indexed, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Timed out waiting for aptos-sdk-macros ${MACROS_VERSION}"
          exit 1

      # When publishing SDK alone, verify the macros dependency is already on crates.io
      - name: Verify aptos-sdk-macros dependency is available
        if: needs.resolve.outputs.publish_macros != 'true' && needs.resolve.outputs.publish_sdk == 'true'
        run: |
          set -euo pipefail
          MACROS_VERSION=$(grep 'aptos-sdk-macros.*version' Cargo.toml | head -1 | sed 's/.*version = "\([^"]*\)".*/\1/')
          echo "Checking that aptos-sdk-macros ${MACROS_VERSION} exists on crates.io..."
          if ! curl -sf -H "User-Agent: aptos-rust-sdk-ci" \
            "https://crates.io/api/v1/crates/aptos-sdk-macros/${MACROS_VERSION}" > /dev/null 2>&1; then
            echo "ERROR: aptos-sdk-macros ${MACROS_VERSION} is not on crates.io."
            echo "Publish the macros crate first (push macros-v${MACROS_VERSION} tag or use 'both')."
            exit 1
          fi
          echo "aptos-sdk-macros ${MACROS_VERSION} is available."

      - name: Verify aptos-sdk can be packaged
        if: needs.resolve.outputs.publish_sdk == 'true'
        run: cargo package -p aptos-sdk --locked

      - name: Publish aptos-sdk
        if: needs.resolve.outputs.publish_sdk == 'true'
        run: cargo publish -p aptos-sdk --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Attest build provenance for aptos-sdk
        if: needs.resolve.outputs.publish_sdk == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'target/package/aptos-sdk-[0-9]*.crate'

  release-notes:
    name: Create Release Notes
    runs-on: 4cpu-gh-ubuntu24-x64
    needs: [resolve, publish]
    if: github.event_name == 'push' && needs.publish.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
