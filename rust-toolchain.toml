[toolchain]
# Matches the pinned toolchain in aptos-labs/aptos-core (rust-toolchain.toml).
# Note: aptos-core omits rustfmt here because it formats with nightly;
# this repo uses stable rustfmt, so rustfmt stays in the component list.
channel = "1.99.1"
components = ["cargo", "clippy", "rustfmt", "rustc", "rust-docs", "rust-std"]
